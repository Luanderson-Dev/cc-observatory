default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Vendored files and licence texts keep their published bytes (VENDOR.json checksums).
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '^src/ccobs/server/static/(vendor|licenses)/'
      - id: end-of-file-fixer
        exclude: '^src/ccobs/server/static/(vendor|licenses)/'
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(bat|cmd)$|^src/ccobs/server/static/(vendor|licenses)/'

  # Tools run through uv so their versions come from uv.lock, the same as in CI.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      # Local commits keep Commitizen's default bypass for Merge, Revert, fixup! and
      # squash! messages (git merge, git revert, autosquash). PR titles, which become the
      # changelog lines, are checked strictly in CI (.github/workflows/pr-title.yml).
      # --allow-abort keeps an empty message as Git's normal "abort the commit".
      - id: commitizen
        name: commitizen check
        entry: uv run cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
