# cc-observatory: the local observability stack for Claude Code.
#
#   docker compose up -d
#
# Every published port binds to 127.0.0.1 (ADR 0001) and can be moved with the
# variable named next to it; copying .env.example to .env is optional. Storage
# services stay on the internal `backend` network; compose.debug.yaml publishes
# them on loopback for debugging.

name: cc-observatory

# Settings shared by every service.
x-service: &service
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

networks:
  # No egress: services only on this network cannot reach the internet or other
  # networks.
  backend:
    internal: true
  # Normal bridge network, for services that publish ports.
  edge: {}

services:
  # OTLP entry point: removes identity and content attributes (ADR 0006), then routes
  # each signal to its store. The image is the pinned upstream collector plus a static
  # busybox for the healthcheck (stack/otel-collector/Dockerfile).
  otel-collector:
    <<: *service
    build: stack/otel-collector
    image: cc-observatory-otel-collector:0.162.0
    pull_policy: build
    command: ["--config=/etc/ccobs/otel-collector/config.yaml"]
    volumes:
      - ./stack/otel-collector:/etc/ccobs/otel-collector:ro
    ports:
      - "127.0.0.1:${CCOBS_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${CCOBS_OTLP_HTTP_PORT:-4318}:4318"
    mem_limit: 256m
    environment:
      # About 80% of mem_limit, so the Go runtime collects garbage before the limit.
      GOMEMLIMIT: 204MiB
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    networks:
      - backend
      - edge
    # No depends_on: the collector accepts OTLP at once, and its exporters queue and
    # retry while the backends start (ADR 0015).

  # Stores Claude Code's events, pushed by the collector to Loki's OTLP endpoint
  # (ADR 0015). Only on the internal backend network, with no published port;
  # compose.debug.yaml publishes it on loopback.
  loki:
    <<: *service
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command:
      - -config.file=/etc/ccobs/loki/config.yaml
      - -config.expand-env=true
    volumes:
      - ./stack/loki:/etc/ccobs/loki:ro
      - loki-data:/loki
    mem_limit: 512m
    environment:
      # About 80% of mem_limit, so the Go runtime collects garbage before the limit.
      GOMEMLIMIT: 409MiB
      # How long events are kept: a multiple of 24h (720h is 30 days; ADR 0016).
      CCOBS_LOKI_RETENTION: ${CCOBS_LOKI_RETENTION:-720h}
    healthcheck:
      # The image has no shell or HTTP client; -health requests /ready on port 3100,
      # which answers once the ingester has been ready for 15 seconds. The longer
      # start_period leaves room to replay the write-ahead log after an unclean stop.
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    networks:
      - backend

volumes:
  loki-data: {}
