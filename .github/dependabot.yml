version: 2

updates:
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Wait a week before proposing a new release (version updates only; security
    # updates are not delayed), so a compromised release has time to be yanked.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      python-packages:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # Remote hook repositories in .pre-commit-config.yaml (ruff, mypy and Commitizen are
  # local hooks run through uv, so the uv entry above keeps them up to date).
  - package-ecosystem: pre-commit
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  # Images in compose.yaml (Dependabot reads the compose*.yaml files in the directory).
  # Each one is pinned as name:tag@sha256:<index digest> (ADR 0020), and Dependabot changes
  # the tag and the digest together, fetching the new tag's digest from the registry
  # (dependabot-core's docker update checker; GitHub's docs do not describe digests).
  # Dependabot raises no security updates for images, so a release that fixes
  # vulnerabilities may be applied by hand before the cooldown ends (ADR 0020).
  # No group: each image gets a pull request of its own, so a breaking release of one
  # service (say Loki) never holds back a patch of another (say Prometheus).
  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Docker and Docker Compose accept only default-days (no semver-*-days).
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Prometheus stays on the 3.13 LTS line, supported until 2027-07-31 (ADR 0013): the
      # stack relies on two experimental feature flags, which a minor release can change
      # or remove, so moving to a newer line is done by hand, with the integration tests.
      # Patch releases of 3.13 still come through here.
      - dependency-name: prom/prometheus
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # Built locally from stack/otel-collector and never pushed, so no registry has it.
      # An entry without versions or update-types ignores every version (dependabot-core
      # should then skip the registry lookup; check the first Dependabot job log). Its base
      # images are updated by the docker entry below; its tag follows the contrib version,
      # changed by hand in the same pull request.
      - dependency-name: cc-observatory-otel-collector
      # The app's image, built locally from stack/app with the repository's own code and
      # never pushed (ADR 0030); its base images are updated by the /stack/app entry.
      - dependency-name: cc-observatory-app

  # The collector's Dockerfile: the contrib image and the busybox image it copies from
  # (both FROM lines, pinned like the compose images).
  # No group either: a contrib release needs a commit by hand in its pull request (the
  # local image tag in compose.yaml and the version in the collector config's header,
  # which tests/test_compose.py checks) and can break the collector config, while a
  # busybox release (only wget, for the healthcheck) passes on its own.
  - package-ecosystem: docker
    directory: /stack/otel-collector
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

  # The app's Dockerfile: the Python base image (builder and runtime stages) and the uv
  # image it copies uv from, all FROM lines pinned like the compose images (ADR 0030).
  # No group: a Python patch and a uv patch are tested on their own.
  - package-ecosystem: docker
    directory: /stack/app
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Python stays on the line of .python-version and the CI matrix's lowest version
      # (3.12): a new minor is moved by hand, together with them.
      - dependency-name: python
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # uv stays within [tool.uv] required-version (>=0.12.23,<0.13) of pyproject.toml,
      # which uv enforces: a new minor is moved by hand, with that range and the
      # uv_build bound. Dependabot names the image without its registry. The 7-day
      # cooldown does not apply to it either: GHCR gives no publication date.
      - dependency-name: astral-sh/uv
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
