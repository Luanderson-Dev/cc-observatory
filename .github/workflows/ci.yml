name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

# Pull requests: one group per PR, and a new push cancels the run in progress.
# Pushes to main and develop: one group per commit, so no run is cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Check that uv.lock is up to date
        run: uv lock --check

      - name: Install the project
        id: sync
        run: uv sync --locked

      # Only for the inline annotations on the PR diff; pre-commit below runs every check.
      - name: Ruff annotations
        run: uv run ruff check --output-format=github .

      - name: pre-commit (ruff, mypy and file checks)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # python-version sets UV_PYTHON for the rest of the job, which overrides .python-version.
      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --locked

      - name: Pytest
        run: uv run pytest

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: uv build only needs the build backend, and sharing the lint job's
      # cache key would let this smaller cache replace the full one.
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      # Release and hotfix PRs into main: the branch name is the version the tag will carry,
      # so a missing or wrong `uv version X.Y.Z` is caught before the tag exists.
      - name: Check that the release branch matches the project version
        if: >-
          github.event_name == 'pull_request' && github.base_ref == 'main' &&
          (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          version="$(uv version --short)"
          if [ "${HEAD_REF##*/}" != "$version" ]; then
            echo "::error::Branch ${HEAD_REF} does not match the project version ${version} in pyproject.toml. Run 'uv version ${HEAD_REF##*/}' on this branch."
            exit 1
          fi
          echo "Branch ${HEAD_REF} matches the project version ${version}."

      - name: Build sdist and wheel
        run: uv build

  # The compose stack: checks compose.yaml and each service's config with the service's
  # own tool, then runs the integration tests, which start the isolated ccobs-it project
  # with `up --build` (tests/integration/conftest.py, ADR 0018).
  #
  # Images are pulled from Docker Hub without logging in: 100 pulls per 6 hours per IP
  # address, about 4 per run. No Docker Hub token is stored; if pulls ever fail with
  # `toomanyrequests`, the images move to another registry instead.
  stack:
    name: Stack configs and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Show the Docker versions
        run: |
          docker version
          docker compose version
          docker buildx version

      # No .env file, as in a fresh clone: every variable takes its default.
      - name: Validate the compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.debug.yaml config --quiet

      # Builds the derived collector image (stack/otel-collector/Dockerfile) for the next
      # step; the integration tests' `up --build` then reuses it from the build cache.
      - name: Build the local images
        run: docker compose build

      # Each check runs the service's image as compose.yaml resolves it (tag and digest,
      # or the image built above), with stack/<service> mounted read-only where
      # compose.yaml mounts it, and no network.
      - name: Validate the service configs
        run: |
          # The resolved compose model, with the integration tests' profiles
          # (tools/stack/isolated.py) so that optional services resolve too. Not
          # `config --images <service>`, which also prints the images of the services
          # it depends on.
          model="$(docker compose --profile traces config --format json)"
          check() {
            local service="$1" binary="$2" image
            shift 2
            image="$(jq -r --arg s "$service" '.services[$s].image // empty' <<<"$model")"
            if [ -z "$image" ]; then
              echo "::error title=No image for ${service}::compose.yaml has no image for the service ${service}"
              return 1
            fi
            echo "${service} (${image}): ${binary} $*"
            docker run --rm --network=none --entrypoint="$binary" \
              --volume="${PWD}/stack/${service}:/etc/ccobs/${service}:ro" "$image" "$@" || {
              echo "::error title=Invalid ${service} config::${binary} $* failed"
              return 1
            }
          }
          check prometheus /bin/promtool check config /etc/ccobs/prometheus/prometheus.yaml
          check loki /usr/bin/loki -config.file=/etc/ccobs/loki/config.yaml -config.expand-env=true -verify-config
          check otel-collector /otelcol-contrib validate --config=/etc/ccobs/otel-collector/config.yaml
          # Tempo and Grafana join in later stages of milestone 1: one `check` line each, here.

      - name: Install the project
        run: uv sync --locked

      # CCOBS_IT_KEEP=1 leaves the ccobs-it project running after the tests, so the steps
      # below can show its resource use and, on failure, its logs before removing it. The
      # step timeout leaves time for them within the job's.
      - name: Integration tests
        id: integration
        timeout-minutes: 12
        env:
          CCOBS_IT_KEEP: "1"
        run: uv run pytest -m integration --no-cov

      - name: Show the stack's resource use
        if: ${{ !cancelled() && steps.integration.outcome != 'skipped' }}
        run: |
          docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}"

      # The same project, env file, compose files and profile as tools/stack/isolated.py.
      - name: Show the stack's state and logs
        if: ${{ failure() && steps.integration.outcome == 'failure' }}
        run: |
          docker compose -p ccobs-it --env-file .env.example -f compose.yaml -f compose.debug.yaml \
            --profile traces ps --all
          docker compose -p ccobs-it --env-file .env.example -f compose.yaml -f compose.debug.yaml \
            --profile traces logs --no-color

      - name: Remove the stack
        if: ${{ always() && steps.integration.outcome != 'skipped' }}
        timeout-minutes: 5
        run: |
          docker compose -p ccobs-it --env-file .env.example -f compose.yaml -f compose.debug.yaml \
            --profile traces down --volumes --remove-orphans
